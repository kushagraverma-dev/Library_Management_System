{% extends "base.html" %}
{% block title %}Edit Book · Library{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2"></i>Edit Book</h3><p class="text-muted">Update the catalogue details and price.</p><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Book title</label><input class="form-control" name="title" value="{{ book.title }}" required></div><div class="col-md-6"><label class="form-label">Author</label><input class="form-control" name="author" value="{{ book.author }}" required></div><div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ book.category }}" required></div><div class="col-md-6"><label class="form-label">ISBN</label><input class="form-control" name="isbn" value="{{ book.isbn }}" required></div><div class="col-md-6"><label class="form-label">Total copies</label><input class="form-control" type="number" min="1" name="copies" value="{{ book.total_copies }}" required></div><div class="col-md-6"><label class="form-label">Book price (₹)</label><input class="form-control" type="number" min="0" step="0.01" name="price" value="{{ book.price }}" required></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary"><i class="bi bi-save me-1"></i>Save changes</button><a href="{{ url_for('librarian_dashboard') }}" class="btn btn-outline-secondary">Cancel</a></div></form></div></div></div></div>
{% endblock %}
