{% extends "base.html" %}
{% block title %}Change Password · Library{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="fw-bold"><i class="bi bi-shield-lock me-2"></i>Change password</h3><p class="text-muted">Use at least 8 characters.</p><form method="post"><label class="form-label">Current password</label><input class="form-control mb-3" type="password" name="current_password" required><label class="form-label">New password</label><input class="form-control mb-3" type="password" name="new_password" minlength="8" required><label class="form-label">Confirm new password</label><input class="form-control mb-4" type="password" name="confirm_password" minlength="8" required><button class="btn btn-primary"><i class="bi bi-key me-1"></i>Change password</button><a href="{{ url_for('profile') }}" class="btn btn-link">Cancel</a></form></div></div></div></div>
{% endblock %}
